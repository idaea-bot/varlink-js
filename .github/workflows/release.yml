# Release to npm on a version tag (DESIGN §8, M12).
#
# NOT RUN YET. Publishing is Pawel's decision (DESIGN §9 Q1). Guards that keep this from publishing by accident:
#   1. It only runs in pzmarzly/varlink-js (the `if:` on both jobs), never in a fork.
#   2. The publish job uses the `npm-release` environment, and the verify job fails unless that environment
#      exists with a "Required reviewers" rule and a deployment branch/tag policy (GitHub would otherwise create it on first use WITHOUT protection
#      rules). Before the first release, in the repository settings:
#        - create the `npm-release` environment with "Required reviewers" (Pawel), and limit its deployment
#          branches and tags to the tag pattern `v*`;
#        - either add NPM_TOKEN as a secret OF THAT ENVIRONMENT (never a repository secret: `secrets.*` also
#          resolves repository secrets, which would not need the approval), or set up npm trusted publishing for
#          this workflow BOUND TO THE `npm-release` ENVIRONMENT and leave NPM_TOKEN unset.
#   3. The tag must equal "v" + package.json "version", and the tagged commit must be on master; prereleases (a
#      version with "-") go to the `next` dist-tag, never `latest`.
#
# To release (after Pawel's OK): bump "version" in package.json, commit to master, `git tag v<version>`, push the
# tag, then approve the deployment in the Actions tab.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify environment, tag, lint, typecheck, test, pack
    if: github.repository == 'pzmarzly/varlink-js'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: The npm-release environment exists and requires reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! env_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/npm-release")"; then
            echo "::error::the npm-release environment does not exist (or cannot be read): create it with required reviewers first"
            exit 1
          fi
          if ! printf '%s' "$env_json" | jq -e 'any(.protection_rules[]?; .type == "required_reviewers")' > /dev/null; then
            echo "::error::the npm-release environment has no required_reviewers protection rule"
            exit 1
          fi
          if ! printf '%s' "$env_json" | jq -e '.deployment_branch_policy != null' > /dev/null; then
            echo "::error::the npm-release environment has no deployment policy (allow only v* tags)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tagged commit $GITHUB_SHA is not on master"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: mkdir -p pkg && npm pack --pack-destination pkg
      - run: node test/fixtures/consumer/run.js --tarball pkg/varlink-js-*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: pkg/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm (manual approval)
    needs: verify
    if: github.repository == 'pzmarzly/varlink-js'
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/varlink-js
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pkg
      - name: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$(ls pkg/varlink-js-*.tgz)"
          version="${tarball#pkg/varlink-js-}"
          version="${version%.tgz}"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "$tarball" --provenance --access public --tag "$dist_tag"
